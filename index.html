    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --tag-bg: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .quick-select {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-width: 900px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .quick-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-btn:hover, .quick-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .stand-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .type-badge {
            background-color: var(--tag-bg);
            color: #e0f2fe;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-item {
            background-color: rgba(15, 23, 42, 0.5);
            border-left: 3px solid var(--accent-color);
            padding: 0.6rem 0.8rem;
            border-radius: 0 6px 6px 0;
        }

        .option-item.custom {
            border-left-color: #f59e0b;
        }

        .option-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        .option-val {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 3rem;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 1100px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        footer strong {
            color: var(--text-main);
        }
    </style>
</head>

        const searchInput = document.getElementById('searchInput');
        const quickSelect = document.getElementById('quickSelect');

        function renderCards(data) {
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results">No matching stands found</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const optionsHtml = item.options.map(opt => `
                    <li class="option-item ${opt.custom ? 'custom' : ''}">
                        <div class="option-label">${opt.label}</div>
                        <div class="option-val">${opt.val}</div>
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <span class="stand-title">${item.stand}</span>
                        <span class="type-badge">${item.type}</span>
                    </div>
                    <ul class="options-list">
                        ${optionsHtml}
                    </ul>
                `;
                grid.appendChild(card);
            });
        }

        function createQuickSelects() {
            const featuredStands = ["101", "105", "110", "12", "203", "208", "302", "41", "54", "61", "80", "901"];
            featuredStands.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = `Stand ${num}`;
                btn.onclick = () => {
                    searchInput.value = num;
                    filterData();
                };
                quickSelect.appendChild(btn);
            });
        }

        function filterData() {
            const rawQuery = searchInput.value.trim();
            const query = rawQuery.toLowerCase().replace(/^(gate|parking|none)\s+/i, '');
            
            if (!query) {
                renderCards(standsData);
                return;
            }

            const querySuffix = query.match(/[lr]$/i)?.[0]?.toLowerCase() || '';
            const baseQuery = querySuffix ? query.slice(0, -1) : query;

            const filtered = standsData.filter(item => {
                const standCode = item.stand.replace(/^(gate|parking|none)\s+/i, '').toLowerCase();
                const standSuffix = standCode.match(/[lr]$/i)?.[0]?.toLowerCase() || '';
                const isFullTitleMatch = item.stand.toLowerCase() === rawQuery.toLowerCase();

                if (isFullTitleMatch) {
                    return true;
                }

                if (querySuffix) {
                    return standCode === query;
                }

                return standCode === query || (
                    !standSuffix && standCode.startsWith(baseQuery) && (standCode === baseQuery || standCode === `${baseQuery}l` || standCode === `${baseQuery}r`)
                );
            });
            
            renderCards(filtered);
        }

        searchInput.addEventListener('input', filterData);

        // Initial render
        renderCards(standsData);
        createQuickSelects();
