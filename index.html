<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGCC (Manchester) - Stand Pushback Finder</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --tag-bg: #0369a1;
            --option-item-bg: rgba(15, 23, 42, 0.5);
        }

        body[data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #dbe3f0;
            --tag-bg: #dbeafe;
            --option-item-bg: rgba(226, 232, 240, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .theme-toggle {
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            border: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.2));
            color: var(--text-main);
            padding: 0.7rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(56, 189, 248, 0.2);
            border-color: var(--accent-color);
        }

        .theme-toggle__icon {
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover .theme-toggle__icon {
            transform: rotate(20deg) scale(1.08);
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .quick-select {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-width: 900px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .quick-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .quick-btn:hover, .quick-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .stand-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .type-badge {
            background-color: var(--tag-bg);
            color: #e0f2fe;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-item {
            background-color: var(--option-item-bg);
            border-left: 3px solid var(--accent-color);
            padding: 0.6rem 0.8rem;
            border-radius: 0 6px 6px 0;
        }

        .option-item.custom {
            border-left-color: #f59e0b;
        }

        .option-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        .option-val {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 3rem;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 1100px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        footer strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>EGCC - iniBuilds Manchester</h1>
        <p>Stand & Pushback Position Lookup</p>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark and light mode" aria-pressed="true">
            <span class="theme-toggle__icon">🌙</span>
            <span class="theme-toggle__label">Dark Mode</span>
        </button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Enter Stand Number (e.g., 101, 105, 12R, 203L)...">
    </div>

    <div class="quick-select" id="quickSelect"></div>

    <div class="grid" id="standsGrid"></div>

    <footer>
        <p>EGCC Pushback Data mapped from GSX Profile v1.5 by <strong>RW Profiles</strong> (reverentan, MichaelWimma & Elton Hjalmarsson).</p>
        <p>Designed for iniBuilds Manchester Airport (EGCC) • For simulation use only.</p>
    </footer>

    <script>
        let standsData = [];

        async function loadStandsData() {
            try {
                const response = await fetch('stands.json');
                if (!response.ok) {
                    throw new Error(`Failed to load stand data: ${response.status}`);
                }

                standsData = await response.json();
                renderCards(standsData);
                createQuickSelects();
            } catch (error) {
                console.error('Unable to load stand data:', error);
                grid.innerHTML = '<div class="no-results">Unable to load stand data.</div>';
            }
        }

        const grid = document.getElementById('standsGrid');
        const searchInput = document.getElementById('searchInput');
        const quickSelect = document.getElementById('quickSelect');
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            if (themeToggle) {
                const icon = themeToggle.querySelector('.theme-toggle__icon');
                const label = themeToggle.querySelector('.theme-toggle__label');
                if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
                if (label) label.textContent = theme === 'light' ? 'Light Mode' : 'Dark Mode';
                themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
            }
        }

        const savedTheme = localStorage.getItem('theme');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        applyTheme(savedTheme || preferredTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const nextTheme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(nextTheme);
            });
        }

        function renderCards(data) {
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results">No matching stands found</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const optionsHtml = item.options.map(opt => `
                    <li class="option-item ${opt.custom ? 'custom' : ''}">
                        <div class="option-label">${opt.label}</div>
                        <div class="option-val">${opt.val}</div>
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <span class="stand-title">${item.stand}</span>
                        <span class="type-badge">${item.type}</span>
                    </div>
                    <ul class="options-list">
                        ${optionsHtml}
                    </ul>
                `;
                grid.appendChild(card);
            });
        }

        function createQuickSelects() {
            quickSelect.innerHTML = '';
            const featuredStands = ["101", "105", "110", "12", "203", "208", "302", "41", "54", "61", "80", "901"];
            featuredStands.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'quick-btn';
                btn.textContent = `Stand ${num}`;
                btn.onclick = () => {
                    searchInput.value = num;
                    filterData();
                };
                quickSelect.appendChild(btn);
            });
        }

        function filterData() {
            const rawQuery = searchInput.value.trim();
            const query = rawQuery.toLowerCase().replace(/^(gate|parking|none)\s+/i, '');
            
            if (!query) {
                renderCards(standsData);
                return;
            }

            const querySuffix = query.match(/[lr]$/i)?.[0]?.toLowerCase() || '';
            const baseQuery = querySuffix ? query.slice(0, -1) : query;

            const filtered = standsData.filter(item => {
                const standCode = item.stand.replace(/^(gate|parking|none)\s+/i, '').toLowerCase();
                const standSuffix = standCode.match(/[lr]$/i)?.[0]?.toLowerCase() || '';
                const isFullTitleMatch = item.stand.toLowerCase() === rawQuery.toLowerCase();

                if (isFullTitleMatch) {
                    return true;
                }

                if (querySuffix) {
                    return standCode === query;
                }

                return standCode === query || (
                    !standSuffix && standCode.startsWith(baseQuery) && (standCode === baseQuery || standCode === `${baseQuery}l` || standCode === `${baseQuery}r`)
                );
            });
            
            renderCards(filtered);
        }

        searchInput.addEventListener('input', filterData);

        // Initial render
        loadStandsData();
    </script>
</body>
</html>
